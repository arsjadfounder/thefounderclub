<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Founder Club — Contact</title>
  <meta name="description" content="Neem contact op met The Founder Club — laat een bericht achter en we nemen snel contact op.">
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#7c3aed;--muted:#94a3b8;--white:#e6eef8}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(180deg,var(--bg),#071023);color:var(--white);padding:2rem}
    .card{width:100%;max-width:720px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:12px;padding:2rem;box-shadow:0 10px 30px rgba(2,6,23,0.7)}
    h1{margin:0 0 .5rem;font-size:1.5rem}
    p.lead{margin:0 0 1.25rem;color:var(--muted)}
    form{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:.25rem}
    input[type=text],input[type=email],textarea{width:100%;padding:.65rem .75rem;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--white);outline:none;font-size:1rem}
    textarea{grid-column:1 / -1;min-height:140px;resize:vertical}
    .full{grid-column:1 / -1}
    .actions{display:flex;gap:.5rem;align-items:center;justify-content:flex-end}
    button{background:var(--accent);color:white;padding:.65rem .9rem;border-radius:8px;border:0;cursor:pointer;font-weight:600}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .note{font-size:.85rem;color:var(--muted)}
    @media (max-width:640px){form{grid-template-columns:1fr} .actions{justify-content:stretch} button{width:100%}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Contact</h1>
    <p class="lead">Heb je vragen of wil je samenwerken? Stuur ons een bericht — we reageren zo snel mogelijk.</p>

    <!-- Formspree form: action uses the provided endpoint so the form is live -->
    <form action="https://formspree.io/f/xdenqbok" method="POST" aria-label="Contactformulier">
      <input type="hidden" name="_subject" value="Nieuw bericht via website">
      <input type="hidden" name="_next" value="/thanks.html">
      <!-- Honeypot to deter bots (Formspree ignores empty fields named _gotcha) -->
      <label class="full" style="display:none">Laat dit veld leeg
        <input name="_gotcha" tabindex="-1" autocomplete="off">
      </label>

      <div>
        <label for="name">Naam</label>
        <input id="name" name="name" type="text" placeholder="Je naam" required>
      </div>

      <div>
        <label for="email">E‑mail</label>
        <input id="email" name="_replyto" type="email" placeholder="naam@voorbeeld.com" required>
      </div>

      <div class="full">
        <label for="subject">Onderwerp</label>
        <input id="subject" name="subject" type="text" placeholder="Kort onderwerp" required>
      </div>

      <div class="full">
        <label for="message">Bericht</label>
        <textarea id="message" name="message" placeholder="Schrijf je bericht hier..." required></textarea>
      </div>

      <div class="full actions">
        <p class="note" style="margin:auto 0 0 0">We sturen binnen 48 uur een reactie.</p>
        <button type="submit">Verstuur</button>
      </div>
    </form>
  </main>
</body>
</html>
